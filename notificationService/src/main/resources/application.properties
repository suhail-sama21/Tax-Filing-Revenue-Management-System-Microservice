# Run on a different port than Eureka!
server.port=8085

spring.application.name=Notifications-SERVICE
spring.config.import=optional:configserver:http://localhost:8888

# ADDED "=true" to the end of the URL
spring.datasource.url=jdbc:mysql://localhost:3306/notifications?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# NEW: Explicitly tell Hibernate to use the MySQL Dialect to prevent metadata errors
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123