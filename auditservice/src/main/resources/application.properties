# Server Configuration
server.port=8085
spring.application.name=AUDIT-SERVICE
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/audit_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Change this to your actual MySQL password!
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#
#eureka.instance.prefer-ip-address=true
## Eureka Client Configuration
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8888

#internal auth configuration
internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123