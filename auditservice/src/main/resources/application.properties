# ==========================================
# 1. SERVER & EUREKA CLIENT SETTINGS
# ==========================================
# Run on a different port than Eureka!
server.port=8088

# The name that will show up on the Eureka Dashboard
spring.application.name=Audit-Service

# Point this service to your running Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# ==========================================
# 2. DATABASE CONFIGURATION
# ==========================================
# (Make sure to update the database name, username, and password to match your local MySQL setup)
spring.datasource.url=jdbc:mysql://localhost:3306/auditservice
spring.datasource.username=root
spring.datasource.password=Ram2122@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true