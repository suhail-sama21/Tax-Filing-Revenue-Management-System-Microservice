spring.application.name=apiGateway
server.port=8088
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#userService
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

#taxpayerService
spring.cloud.gateway.server.webflux.routes[1].id=taxpayer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TAXPAYER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/taxpayers/**

#taxFilingService
spring.cloud.gateway.server.webflux.routes[2].id=tax-filing-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TAX-FILING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/documents/**,/api/filings/**

#reportingService
