# Server Configuration
server.port=8084
spring.application.name=payment-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Change this to your actual MySQL password!
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123