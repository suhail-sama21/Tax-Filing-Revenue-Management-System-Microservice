# Server Configuration
server.port=8082
spring.application.name=TAXPAYER-SERVICE

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/taxease_taxpayer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
spring.config.import=optional:configserver:http://localhost:8888

internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123