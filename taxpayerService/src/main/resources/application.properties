# ==========================================
# 1. SERVER & EUREKA CLIENT SETTINGS
# ==========================================
# Run on a different port than Eureka!
server.port=8082

# The name that will show up on the Eureka Dashboard
spring.application.name=TAXPAYER-SERVICE

# Point this service to your running Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# ==========================================
# 2. DATABASE CONFIGURATION
# ==========================================
# (Make sure to update the database name, username, and password to match your local MySQL setup)
spring.datasource.url=jdbc:mysql://localhost:3306/TaxpayerServiceApplication
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true