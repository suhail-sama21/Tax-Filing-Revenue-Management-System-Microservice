# Server Configuration
server.port=8082
spring.application.name=TAXPAYER-SERVICE

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/taxease_taxpayer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Add this to ALL microservices (Taxpayer, User, etc.)
eureka.instance.prefer-ip-address=true

internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123
