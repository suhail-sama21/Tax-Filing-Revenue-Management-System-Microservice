# Server Configuration
server.port=8086
spring.application.name=compliance-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/compliance_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Change this to your actual MySQL password!
spring.datasource.password=password  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:configserver:http://localhost:8888

internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123