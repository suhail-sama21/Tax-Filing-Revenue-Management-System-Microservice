# Server Configuration
server.port=8081
spring.application.name=user-service

# Database Configuration (Assuming MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/taxease_user_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.config.import=optional:configserver:http://localhost:8888

internal.auth.header-name=X-Internal-Service-Key
internal.auth.secret-value=YourSuperSecretKey123