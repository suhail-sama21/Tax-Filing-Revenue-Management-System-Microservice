spring.application.name=ConfiguarationServer
server.port=9999

# Use the HTTPS URL for your private repo
spring.cloud.config.server.git.uri=https://github.com/Mazhaiyarasan108/ConfigurationServer

# Pulling from the environment variables you just set
spring.cloud.config.server.git.username=${GITHUB_USERNAME}
spring.cloud.config.server.git.password=${GITHUB_TOKEN}

# This helps debug if the connection is working immediately
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.skip-ssl-validation=true